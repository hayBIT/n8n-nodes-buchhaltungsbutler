name: Publish to npm

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          RELEASE_MODE: 'true' # satisfies the n8n-node prepublishOnly guard
          # optional: only needed for the very first publish (or if no Trusted Publisher is configured)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
